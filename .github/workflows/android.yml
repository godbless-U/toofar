name: Build MADAR Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-android v3 requested the retired SDK package "tools" by default.
      # v4 uses current command-line tools; explicitly list only supported packages.
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify Android SDK installation
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are both unset."
            exit 1
          fi
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo "Android SDK Platform 36 and Build Tools 36.0.0 are installed."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build APK and run unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MADAR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
